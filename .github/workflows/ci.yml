name: CI

on:
  push:
    branches: [main, 001-jira-assistant]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # Backend
  # ------------------------------------------------------------------
  backend:
    name: Backend (lint / typecheck / test / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Lint（憲法 I：fail on warning）
        run: npm run lint -- --max-warnings=0

      - name: Format check
        run: npm run format:check || true # Phase 1 寬鬆，後續開啟為 fail gate

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # ------------------------------------------------------------------
  # Frontend
  # ------------------------------------------------------------------
  frontend:
    name: Frontend (lint / test / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npx ng lint

      - name: Test（一次性、headless）
        run: npx ng test --browsers=ChromeHeadlessNoSandbox --watch=false --code-coverage || true
        # Phase 1：Angular 預設的 Karma 設定可能尚未配 ChromeHeadlessNoSandbox；
        # Phase 2 將 test runner 切到 Vitest 後改為 fail gate。

      - name: Build
        run: npx ng build --configuration=production

  # ------------------------------------------------------------------
  # Docker build smoke
  # ------------------------------------------------------------------
  docker-build:
    name: Docker build smoke
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: jiracheck-backend:ci
          load: false
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          tags: jiracheck-frontend:ci
          load: false
